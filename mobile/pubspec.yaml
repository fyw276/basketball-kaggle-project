name: smart_outfit_assistant
description: 智能穿搭助手移动端应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.2

  # 图片选择
  image_picker: ^1.0.7

  # UI 组件
  cupertino_icons: ^1.0.6

  # 路由
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 如果需要添加资源文件
  # assets:
  #   - images/

name: smart_outfit_assistant
description: 智能穿搭助手移动端应用
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  http: ^1.2.0
  http_parser: ^4.0.2

  # 本地存储
  shared_preferences: ^2.2.2

  # 图片选择
  image_picker: ^1.0.7

  # UI 组件
  cupertino_icons: ^1.0.6

  # 路由
  go_router: ^13.0.0
  path_provider: ^2.1.5

  # 定位（智能穿搭天气）
  geolocator: ^13.0.2
  city_pickers: ^1.3.0

  # 保存图片到相册
  gal: ^2.3.0

  # Web 端打开 URL（用于 Web 下载图片）
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 如果需要添加资源文件
  # assets:
  #   - images/

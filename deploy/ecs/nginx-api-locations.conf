# Paste these `location` blocks inside the `server { ... }` that serves Flutter Web
# (e.g. root /usr/share/nginx/html; listen 80;).
#
# Flutter Web (api_base_resolver_web.dart) calls same-origin `/api/v1/...` — without this,
# Nginx serves only static files and POST /api/v1/smart-outfit/generate returns 404.
#
# After editing: `sudo nginx -t && sudo systemctl reload nginx`
#
# Docs: docs/PRODUCTION_DEPLOY.md

location /api/v1/ {
    proxy_pass http://127.0.0.1:8010/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 20m;
}

location = /predict {
    proxy_pass http://127.0.0.1:8010/predict;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8m;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:8010/uploads/;
    proxy_set_header Host $host;
    client_max_body_size 20m;
}

#探针与发布台账（勿交给 try_files /index.html，否则返回 HTML）

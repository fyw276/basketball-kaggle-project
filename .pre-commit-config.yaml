# Pre-commit hooks configuration for Smart Outfit Assistant
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Skip: git commit --no-verify

default_language_version:
  python: python3  # Use system Python (compatible with 3.11-3.14)

repos:
  # General file checks (fast)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]

  # Secrets detection (security) - Temporarily disabled due to baseline encoding issues
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', 'backend/.secrets.baseline']
  #       exclude: package.lock.json
  #       stages: [pre-commit]

  # Python code formatting (fast, auto-fix)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        stages: [pre-commit]
        files: ^backend/

  # Python import sorting (fast, auto-fix)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "100"]
        stages: [pre-commit]
        files: ^backend/

  # Python linting (fast)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        stages: [pre-commit]
        files: ^backend/

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Allowed types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert
        # Scope is optional

  # Python tests (pre-push only, slower)
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: bash -c 'cd backend && pytest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        args: ["-v", "--tb=short", "-x"]
        # -x stops at first failure for faster feedback

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest-check]  # Skip tests in CI (run separately)
  submodules: false
